<svg xmlns="http://www.w3.org/2000/svg" width="470" height="176" viewBox="0 0 470 176" role="img" aria-label="NimuthuGanegoda contribution streak" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#0e1727"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f2ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="0" y="0" width="470" height="176" rx="14"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="469" height="175" rx="14" fill="url(#card)" stroke="#1d2b40"/>
<g transform="translate(24,26)">
    <path d="M12 2c2.2 3.2 5.4 5.1 5.4 8.9 0 1.6-.7 3-1.8 4 .3-1.6-.6-3.2-2-4.2.4 2.4-1.2 3.6-2.6 4.8-1.6 1.4-2.4 3-2.4 4.6C8.6 24.6 12.4 28 17 28c5.6 0 9.6-4.1 9.6-9.6 0-7.4-6.4-10.6-14.6-16.4z" fill="url(#accent)" opacity="0.9">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="62" y="40" fill="#e6edf3" font-size="14" font-weight="700" letter-spacing="0.4">Contribution streak</text>
  <text x="24" y="92" fill="#00f2ff" font-size="44" font-weight="800">32</text>
  <text x="24" y="112" fill="#8b98a9" font-size="12" font-weight="600" letter-spacing="0.5">DAYS IN A ROW</text>
  <text x="24" y="136" fill="#8b98a9" font-size="11.5">1,690 contributions</text>
  <text x="24" y="152" fill="#8b98a9" font-size="11.5">in the last twelve months</text>
  <rect x="178" y="76" width="1" height="72" fill="#1d2b40"/>
  <text x="196" y="96" fill="#8b98a9" font-size="10" font-weight="600" letter-spacing="0.6">LONGEST STREAK</text>
  <text x="446" y="96" text-anchor="end" fill="#e6edf3" font-size="13.5" font-weight="700">32 days</text>
  <text x="196" y="122" fill="#8b98a9" font-size="10" font-weight="600" letter-spacing="0.6">ACTIVE DAYS</text>
  <text x="446" y="122" text-anchor="end" fill="#e6edf3" font-size="13.5" font-weight="700">166</text>
  <text x="196" y="148" fill="#8b98a9" font-size="10" font-weight="600" letter-spacing="0.6">BUSIEST DAY</text>
  <text x="446" y="148" text-anchor="end" fill="#e6edf3" font-size="13.5" font-weight="700">130 commits</text>
  <g clip-path="url(#cardClip)">
    <rect x="-170" y="0" width="170" height="176" fill="url(#sweep)" opacity="0.07">
      <animate attributeName="x" values="-170;470" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
