<svg xmlns="http://www.w3.org/2000/svg" width="470" height="196" viewBox="0 0 470 196" role="img" aria-label="NimuthuGanegoda top languages" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#0e1727"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f2ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="0" y="0" width="470" height="196" rx="14"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="469" height="195" rx="14" fill="url(#card)" stroke="#1d2b40"/>
  <text x="24" y="38" fill="#e6edf3" font-size="14" font-weight="700">Most used languages</text>
  <text x="24" y="58" fill="#8b98a9" font-size="11">by bytes committed across public repositories</text>
  <g clip-path="url(#barRadius)">
    <clipPath id="barRadius"><rect x="24" y="82" width="422" height="14" rx="7"/></clipPath>
    <rect x="24.00" y="82" width="119.73" height="14" fill="#e34c26">
      <title>HTML 28.4%</title>
      <animate attributeName="width" values="0;0;119.73;119.73" keyTimes="0;0.00;0.45;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="143.73" y="82" width="54.83" height="14" fill="#00B4AB">
      <title>Dart 13.0%</title>
      <animate attributeName="width" values="0;0;54.83;54.83" keyTimes="0;0.08;0.53;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="198.56" y="82" width="51.16" height="14" fill="#f34b7d">
      <title>C++ 12.1%</title>
      <animate attributeName="width" values="0;0;51.16;51.16" keyTimes="0;0.16;0.61;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="249.72" y="82" width="44.20" height="14" fill="#DA3434">
      <title>CMake 10.5%</title>
      <animate attributeName="width" values="0;0;44.20;44.20" keyTimes="0;0.24;0.69;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="293.92" y="82" width="36.39" height="14" fill="#3572A5">
      <title>Python 8.6%</title>
      <animate attributeName="width" values="0;0;36.39;36.39" keyTimes="0;0.32;0.77;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="330.31" y="82" width="32.37" height="14" fill="#00ADD8">
      <title>Go 7.7%</title>
      <animate attributeName="width" values="0;0;32.37;32.37" keyTimes="0;0.40;0.85;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <circle cx="29" cy="122" r="5" fill="#e34c26"/>
    <text x="42" y="126" fill="#e6edf3" font-size="12" font-weight="600">HTML</text>
    <text x="140" y="126" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">28.4%</text>
  </g>
  <g>
    <circle cx="247" cy="122" r="5" fill="#00B4AB"/>
    <text x="260" y="126" fill="#e6edf3" font-size="12" font-weight="600">Dart</text>
    <text x="358" y="126" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">13.0%</text>
  </g>
  <g>
    <circle cx="29" cy="146" r="5" fill="#f34b7d"/>
    <text x="42" y="150" fill="#e6edf3" font-size="12" font-weight="600">C++</text>
    <text x="140" y="150" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">12.1%</text>
  </g>
  <g>
    <circle cx="247" cy="146" r="5" fill="#DA3434"/>
    <text x="260" y="150" fill="#e6edf3" font-size="12" font-weight="600">CMake</text>
    <text x="358" y="150" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">10.5%</text>
  </g>
  <g>
    <circle cx="29" cy="170" r="5" fill="#3572A5"/>
    <text x="42" y="174" fill="#e6edf3" font-size="12" font-weight="600">Python</text>
    <text x="140" y="174" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">8.6%</text>
  </g>
  <g>
    <circle cx="247" cy="170" r="5" fill="#00ADD8"/>
    <text x="260" y="174" fill="#e6edf3" font-size="12" font-weight="600">Go</text>
    <text x="358" y="174" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">7.7%</text>
  </g>
  <g clip-path="url(#cardClip)">
    <rect x="-170" y="0" width="170" height="196" fill="url(#sweep)" opacity="0.07">
      <animate attributeName="x" values="-170;470" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
