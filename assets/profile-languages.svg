<svg xmlns="http://www.w3.org/2000/svg" width="470" height="196" viewBox="0 0 470 196" role="img" aria-label="NimuthuGanegoda top languages" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#0e1727"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f2ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="0" y="0" width="470" height="196" rx="14"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="469" height="195" rx="14" fill="url(#card)" stroke="#1d2b40"/>
  <text x="24" y="38" fill="#e6edf3" font-size="14" font-weight="700">Most used languages</text>
  <text x="24" y="58" fill="#8b98a9" font-size="11">by bytes committed across public repositories</text>
  <g clip-path="url(#barRadius)">
    <clipPath id="barRadius"><rect x="24" y="82" width="422" height="14" rx="7"/></clipPath>
    <rect x="24.00" y="82" width="84.31" height="14" fill="#00B4AB">
      <title>Dart 20.0%</title>
      <animate attributeName="width" values="0;0;84.31;84.31" keyTimes="0;0.00;0.45;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="108.31" y="82" width="78.66" height="14" fill="#f34b7d">
      <title>C++ 18.6%</title>
      <animate attributeName="width" values="0;0;78.66;78.66" keyTimes="0;0.08;0.53;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="186.97" y="82" width="67.96" height="14" fill="#DA3434">
      <title>CMake 16.1%</title>
      <animate attributeName="width" values="0;0;67.96;67.96" keyTimes="0;0.16;0.61;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="254.93" y="82" width="53.29" height="14" fill="#3572A5">
      <title>Python 12.6%</title>
      <animate attributeName="width" values="0;0;53.29;53.29" keyTimes="0;0.24;0.69;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="308.22" y="82" width="37.41" height="14" fill="#198CE7">
      <title>R 8.9%</title>
