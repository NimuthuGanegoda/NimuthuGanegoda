<svg xmlns="http://www.w3.org/2000/svg" width="470" height="196" viewBox="0 0 470 196" role="img" aria-label="NimuthuGanegoda top languages" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#0e1727"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f2ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="0" y="0" width="470" height="196" rx="14"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="469" height="195" rx="14" fill="url(#card)" stroke="#1d2b40"/>
  <text x="24" y="38" fill="#e6edf3" font-size="14" font-weight="700">Most used languages</text>
  <text x="24" y="58" fill="#8b98a9" font-size="11">by bytes committed across public repositories</text>
  <g clip-path="url(#barRadius)">
    <clipPath id="barRadius"><rect x="24" y="82" width="422" height="14" rx="7"/></clipPath>
    <rect x="24.00" y="82" width="83.23" height="14" fill="#00B4AB">
      <title>Dart 19.7%</title>
      <animate attributeName="width" values="0;0;83.23;83.23" keyTimes="0;0.00;0.45;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="107.23" y="82" width="77.66" height="14" fill="#f34b7d">
      <title>C++ 18.4%</title>
      <animate attributeName="width" values="0;0;77.66;77.66" keyTimes="0;0.08;0.53;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="184.89" y="82" width="67.10" height="14" fill="#DA3434">
      <title>CMake 15.9%</title>
      <animate attributeName="width" values="0;0;67.10;67.10" keyTimes="0;0.16;0.61;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="251.99" y="82" width="52.62" height="14" fill="#3572A5">
      <title>Python 12.5%</title>
      <animate attributeName="width" values="0;0;52.62;52.62" keyTimes="0;0.24;0.69;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="304.61" y="82" width="36.93" height="14" fill="#198CE7">
      <title>R 8.8%</title>
      <animate attributeName="width" values="0;0;36.93;36.93" keyTimes="0;0.32;0.77;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="341.54" y="82" width="30.47" height="14" fill="#e34c26">
      <title>HTML 7.2%</title>
      <animate attributeName="width" values="0;0;30.47;30.47" keyTimes="0;0.40;0.85;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <circle cx="29" cy="122" r="5" fill="#00B4AB"/>
    <text x="42" y="126" fill="#e6edf3" font-size="12" font-weight="600">Dart</text>
    <text x="140" y="126" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">19.7%</text>
  </g>
  <g>
    <circle cx="247" cy="122" r="5" fill="#f34b7d"/>
    <text x="260" y="126" fill="#e6edf3" font-size="12" font-weight="600">C++</text>
    <text x="358" y="126" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">18.4%</text>
  </g>
  <g>
    <circle cx="29" cy="146" r="5" fill="#DA3434"/>
    <text x="42" y="150" fill="#e6edf3" font-size="12" font-weight="600">CMake</text>
    <text x="140" y="150" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">15.9%</text>
  </g>
  <g>
    <circle cx="247" cy="146" r="5" fill="#3572A5"/>
    <text x="260" y="150" fill="#e6edf3" font-size="12" font-weight="600">Python</text>
    <text x="358" y="150" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">12.5%</text>
  </g>
  <g>
    <circle cx="29" cy="170" r="5" fill="#198CE7"/>
    <text x="42" y="174" fill="#e6edf3" font-size="12" font-weight="600">R</text>
    <text x="140" y="174" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">8.8%</text>
  </g>
  <g>
    <circle cx="247" cy="170" r="5" fill="#e34c26"/>
    <text x="260" y="174" fill="#e6edf3" font-size="12" font-weight="600">HTML</text>
    <text x="358" y="174" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">7.2%</text>
  </g>
  <g clip-path="url(#cardClip)">
    <rect x="-170" y="0" width="170" height="196" fill="url(#sweep)" opacity="0.07">
      <animate attributeName="x" values="-170;470" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
