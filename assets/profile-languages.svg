  <g>
    <circle cx="29" cy="122" r="5" fill="#00B4AB"/>
    <text x="42" y="126" fill="#e6edf3" font-size="12" font-weight="600">Dart</text>
    <text x="140" y="126" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">20.0%</text>
  </g>
  <g>
    <circle cx="247" cy="122" r="5" fill="#f34b7d"/>
    <text x="260" y="126" fill="#e6edf3" font-size="12" font-weight="600">C++</text>
    <text x="358" y="126" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">18.6%</text>
  </g>
  <g>
    <circle cx="29" cy="146" r="5" fill="#DA3434"/>
    <text x="42" y="150" fill="#e6edf3" font-size="12" font-weight="600">CMake</text>
    <text x="140" y="150" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">16.1%</text>
  </g>
  <g>
    <circle cx="247" cy="146" r="5" fill="#3572A5"/>
    <text x="260" y="150" fill="#e6edf3" font-size="12" font-weight="600">Python</text>
    <text x="358" y="150" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">12.6%</text>
  </g>
  <g>
    <circle cx="29" cy="170" r="5" fill="#198CE7"/>
    <text x="42" y="174" fill="#e6edf3" font-size="12" font-weight="600">R</text>
    <text x="140" y="174" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">8.9%</text>
  </g>
  <g>
    <circle cx="247" cy="170" r="5" fill="#e34c26"/>
    <text x="260" y="174" fill="#e6edf3" font-size="12" font-weight="600">HTML</text>
    <text x="358" y="174" fill="#8b98a9" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">7.3%</text>
  </g>
  <g clip-path="url(#cardClip)">
    <rect x="-170" y="0" width="170" height="196" fill="url(#sweep)" opacity="0.07">
      <animate attributeName="x" values="-170;470" dur="9s" repeatCount="indefinite"/>
    </rect>
